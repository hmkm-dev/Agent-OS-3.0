[pytest]
# Keep legacy root tests and organized tests/unit packages importable without
# pytest assigning both trees the same synthetic package namespace.
addopts = --import-mode=importlib
markers =
    unit: fast, no external dependencies, always run in CI
    integration: needs a live local stack (docker compose) but no external cloud credentials
    e2e: full end-to-end flow needing a live deployed stack
    external: requires real external credentials (OpenRouter, Qdrant Cloud, R2, Brave, GitHub, Cloudflare, n8n) — never run in CI
